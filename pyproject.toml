[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-up"
version = "1.8.1"
description = "Build an eye-aligned face timelapse from photos of one person in an Immich library"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python>=4.9",
	# 1.0.1 aborts building the face landmarker on macOS: its detection step
    # insists on a Metal service the CPU graph never provides, and a CPU delegate
    # does not avoid it. The pool reports only "terminated abruptly".
    "mediapipe>=0.10.14,<1.0",
    "pillow>=10.2",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grow-up = "grow_up.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` work straight from a checkout, without an editable install and
# without the heavy runtime stack (mediapipe, opencv, scipy) being present.
pythonpath = ["src"]
