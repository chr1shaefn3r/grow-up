# Copy to config.toml and edit. Credentials are NOT stored here -- they come
# from the IMMICH_URL and IMMICH_API_KEY environment variables, so this file
# stays safe to commit.

[immich]
# The person as tagged in Immich, matched by name on the first run. Only used to
# find the ID; once that is known this setting is never read again.
person_name = "Their Name"
# Filled in after the first lookup; setting it skips the name resolution.
person_id = ""

# More than one account? Immich scopes face recognition per account, so a search
# with your person id never returns photos sitting in a partner's library -- the
# association between a face and a person belongs to whoever owns it. Asking
# again as them is the only way to reach those photos.
#
# Uncomment and fill in one block per account. Doing so replaces the two settings
# above; leaving it commented out keeps the single-account behaviour, which is
# what most libraries want.
#
# `name` is an identity rather than a label: it is stored on every indexed asset
# so later stages know which key can download it, so renaming one re-indexes it.
# Each account needs its own API key in its own environment variable, and the
# partner's key needs the same four permissions as yours.
#
#   [[immich.sources]]
#   name = "me"
#   person_id = ""                       # your account's record for the subject
#   key_env = "IMMICH_API_KEY"           # default
#   url_env = "IMMICH_URL"               # default; set it if they are on another server
#
#   [[immich.sources]]
#   name = "partner"
#   person_id = ""                       # *their* account's record for the same person
#   key_env = "IMMICH_API_KEY_PARTNER"

# Where everything lives, relative to this config file.
[paths]
# The manifest: which assets exist, what has been downloaded, analyzed, filtered
# and warped. Every stage is resumable because of it, so deleting this file is
# the one destructive act here -- it forces a full re-index and re-analyze.
db = "data/grow-up.sqlite"
# Downloaded originals, one file per asset. Much the largest directory. Safe to
# delete when you are done; the cost is re-downloading.
cache = "data/originals"
# Aligned frames, rewritten from the cache on every `align` run. Purely derived,
# so deleting it costs a warp pass and nothing else.
frames = "data/frames"
# The video, contact sheet and rejects page -- everything meant for a human.
out = "out"

[index]
# Assets per request to Immich's search endpoint. A round-trip/memory trade-off
# only: it changes how the asset list is paged, never which assets come back.
page_size = 1000

[fetch]
# Simultaneous requests. Originals are often several MB each, so this is the
# knob to turn down first if downloads start returning 429 or 502 -- a reverse
# proxy in front of Immich will shed load long before Immich itself does.
concurrency = 8
# Retries per request on transient failures (429, 5xx, dropped connections),
# with exponential backoff that honours Retry-After.
retries = 4
# "original" for maximum quality; "preview" is smaller and always a JPEG, which
# sidesteps HEIC decoding at the cost of resolution.
source = "original"

[analyze]
# The MediaPipe FaceLandmarker bundle, put here by `grow-up fetch-model`.
model_path = "models/face_landmarker.task"

# -- time/accuracy dial -------------------------------------------------------
# "fast" is one look per photo and is bit-identical to the original behaviour;
# the levels above it spend time on photos where the first look finds nothing,
# and on averaging several looks per face.
#
#   fast      1x    one crop, no retries
#   balanced  ~1.3x retries a failed detection with wider/tighter/equalised crops
#   thorough  ~3.5x adds rotated retries and a 3-crop median per face
#
# `grow-up trial --compare` measures all three over the same sample so the
# trade-off is a number rather than a guess.
effort = "fast"
# Any of the settings a preset controls can be set here to override just that
# one: retry_margins, retry_rotations, retry_equalize, ensemble, max_crop_px.

# -- what counts as a face ----------------------------------------------------
bbox_margin = 0.8      # grow Immich's face box before landmarking; the mesh wants context
# Two thresholds, one word apart. Detection is whether the face detector finds a
# face in the crop at all; presence is whether the landmark model still believes
# one is there once it looks. Lower either to keep marginal faces.
min_face_detection_confidence = 0.5
min_face_presence_confidence = 0.5
oob_inset = 0.0        # pixels of margin when testing landmarks against the frame edge

# -- runtime ------------------------------------------------------------------
# 0 detects physical cores: sysctl on macOS, sysfs topology on Linux, capped by
# any affinity or container limit. Apple Silicon has no hyperthreading, so an
# M1 Pro correctly yields 8 (6 performance + 2 efficiency), not 4.
workers = 0
# MediaPipe, TFLite and the GL context log heavily from C++ on startup -- fiber
# init, XNNPACK delegates, feedback managers -- once per worker. Hidden by
# default; set true (or pass --verbose) when diagnosing the model itself.
verbose = false

# Hard filters. Anything failing one of these never becomes a frame.
# Loosen these first if the rejects gallery is full of frames you would have kept.
# `out/rejects.html` has a slider per threshold that previews the effect of a
# change before you make it here.
[filter]
max_yaw = 20.0             # degrees; head turned left/right
max_pitch = 18.0           # degrees; head nodding up/down
max_roll = 25.0            # degrees; head tilted (alignment corrects this, so it can be generous)
max_gaze = 0.35            # 0..1; eyes looking away from the lens, independent of head pose
max_blink = 0.45           # 0..1; higher means more half-closed eyes get through
max_oob_frac = 0.005       # fraction of the 478 landmarks allowed outside the frame
allow_bbox_clipped = false # accept faces touching the image edge
min_interocular_px = 60.0  # eye-to-eye distance; below this the frame upscales badly
min_sharpness = 12.0       # Laplacian variance on the eye region at a canonical scale
# Brightness limits on the face crop, in 0..255. The measurements are the 5th and
# 95th percentile of its luma, so a few specular highlights do not condemn a
# frame -- only genuinely crushed shadows or blown-out skin do.
min_exposure_lo = 8.0      # reject below this: the face is lost in shadow
max_exposure_hi = 250.0    # reject above this: the face is blown out

# Relative weights for ranking the survivors. Only their ratios matter: the
# score is a weighted mean of the terms below, each normalised against the very
# threshold that would have rejected the frame. Raise one to change which photo
# wins its bucket; none of this can rescue a frame the filters already rejected.
[score]
w_pose = 1.0       # how square-on the head is, averaged over yaw, pitch and roll
w_gaze = 1.0       # how close the eyes are to looking straight down the lens
w_eyes_open = 1.0  # 1 minus the stronger of the two blink values
w_sharpness = 1.0  # eye-region detail, saturating at 8x min_sharpness
w_size = 0.5       # eye-to-eye distance, saturating at 4x min_interocular_px

[trial]
# `grow-up trial` processes this many assets, measures each stage, and projects
# the full run from it. A trial is a partial real run -- everything it downloads
# and analyzes is cached, so none of the work is repeated afterwards.
limit = 100

[select]
# day | week | month | all -- bucket the timeline and keep the best per bucket,
# so a photo-heavy holiday cannot dominate the video.
cadence = "week"
# Frames kept per bucket, best-scoring first. Above 1 the video lingers on the
# busier weeks, which is usually not what a timelapse wants -- widen the cadence
# instead if the result is too short.
per_bucket = 1
# Runner-ups per bucket to warp alongside the pick. They never enter the video;
# they let out/contact-sheet.html show what would take over if you reject the
# pick, so a rejection is decided in the page instead of costing a re-run to see
# the replacement. Costs align time and frames-directory space roughly in
# proportion -- 2 means three warps per bucket. Set 0 to turn it off.
alternates = 2

[output]
# Frame size in pixels, and therefore the video resolution. The ratio matters as
# much as the size: it decides how much of the head fits beside the eyes, which
# [align] then positions. 1080x1350 is 4:5 portrait.
width = 1080
height = 1350
# Second pass over the finished frames that pulls each one's brightness toward
# the median of its neighbours, damping the flicker that comes from photos shot
# under different light on consecutive days. Costs one extra pass over the
# frames; set false to see the original exposure of every shot.
flicker_match = true

[align]
# How far apart the eyes sit, as a fraction of the frame width. This is the
# knob that decides how much room there is around the face: a head is roughly
# 2.4-3.0x the interocular distance across, so 0.20 puts it at about half the
# frame width, with space for hair and shoulders. Larger fills more of the
# frame and eventually crops the head.
eye_distance = 0.20
# Height of the eye line, as a fraction of the frame height.
eye_level = 0.42
# What fills the frame where it reaches past the edge of the source photo.
# "edge" stretches the outermost pixels into bars; "blur" keeps the same
# content softened, which reads as a deliberate surround.
fill = "blur"          # blur | edge | black
# Allowance for what the landmark mesh does not cover -- hair, ears and the
# cranium above the forehead -- when checking whether a face fits the frame.
# Only affects the advisory report, never the framing itself.
fit_margin = 1.5

[encode]
# Written into paths.out. `grow-up trial` prefixes "trial-" so a trial can never
# overwrite the real video.
filename = "timelapse.mp4"
# Playback rate. Together with select.cadence it sets the pace: one frame per
# week at 10 fps covers about a year in five seconds.
fps = 10
codec = "libx264"          # "hevc_videotoolbox" is much faster on Apple Silicon
# Quality for the software x264/x265 encoders, roughly 0 (lossless) to 51. Lower
# is better and bigger; 18 is visually near-transparent. Hardware encoders like
# hevc_videotoolbox ignore it -- they take a bitrate instead.
crf = 18
interpolate = false        # ffmpeg minterpolate; smoother but very slow

# Burn a footer into the video: capture date bottom left, age bottom right. The
# age comes from the birth date on the person in Immich; without one, only the
# date is drawn and the run says so. Enabling this writes *both* videos -- the
# plain one and `<filename>-annotated` -- so a date format you end up disliking
# can never cost you the clean render.
[encode.annotate]
# false leaves the run exactly as it was: one video, no footer, nothing read.
enabled = false
date = true                 # the capture date, bottom left
# days | months | year_months | off -- bottom right. year_months omits a zero
# part ("5 months", not "0 years, 5 months") and falls back to days under one
# month, because "0 months" is wrong exactly where change is fastest.
age = "year_months"
language = "en"             # en | de | fr | es | it -- month names, plurals, separators
# Tokens, not strftime: YYYY YY MMMM MMM MM DD D. Month names follow `language`,
# so "D MMMM YYYY" reads 5 August 2026 or 5 août 2026.
date_format = "YYYY-MM-DD"
# Path to a .ttf or .otf. Empty picks a system face, falling back to the one
# bundled with Pillow. Set it if your language needs glyphs the default lacks.
font = ""
